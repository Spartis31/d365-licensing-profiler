name: Translate request

# Declenche quand une demande recoit l'etiquette posee par l'application.
on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  translate:
    if: github.event.label.name == 'traduction-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Traduire les libelles
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          TRANSLATION_ENDPOINT: ${{ secrets.TRANSLATION_ENDPOINT }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
        run: python tools/translate_request.py

      - name: Publier le commentaire
        if: hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file comment.md
