name: Update standard roles

# Triggered from the application ("Update standard roles" button) or automatically
# on the 3rd of each month, the guide being published monthly.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if the edition has not changed"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 3 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-roles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pdfplumber

      - name: Download the Licensing Guide
        id: guide
        run: python tools/fetch_guide.py

      - name: Compare with the bundled edition
        id: compare
        env:
          NEW_EDITION: ${{ steps.guide.outputs.edition }}
          FORCE: ${{ inputs.force }}
        run: |
          CURRENT=$(grep -oP "ROLES_GUIDE_EDITION = '\K[^']+" src/data/standardRoles.ts)
          echo "bundled   : $CURRENT"
          echo "published : $NEW_EDITION"
          if [ "$CURRENT" = "$NEW_EDITION" ] && [ "$FORCE" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Catalog already up to date ($CURRENT)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract and regenerate
        if: steps.compare.outputs.changed == 'true'
        env:
          GUIDE_EDITION: ${{ steps.guide.outputs.edition }}
        run: |
          python tools/extract_roles_plumber.py
          python tools/generate_roles_ts.py

      # Quality gate: a degraded extraction must never open a PR.
      - name: Quality check
        if: steps.compare.outputs.changed == 'true'
        run: python tools/check_generated.py

      - uses: actions/setup-node@v7
        if: steps.compare.outputs.changed == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Regression tests
        if: steps.compare.outputs.changed == 'true'
        run: |
          npm ci
          npm test

      - name: Open the pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_EDITION: ${{ steps.guide.outputs.edition }}
        run: |
          if git diff --quiet -- src/data/standardRoles.ts; then
            echo "::notice::No change in the role catalog."
            exit 0
          fi
          BRANCH="roles/${NEW_EDITION// /-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/standardRoles.ts
          git commit -m "Standard roles: edition $NEW_EDITION"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "Standard roles: edition $NEW_EDITION" \
            --body "Regenerated automatically from the published Licensing Guide.

          - Edition: **$NEW_EDITION**
          - Source: permalink \`go.microsoft.com/fwlink/?LinkId=866544\`
          - Quality check and regression tests passed

          Review the diff of \`src/data/standardRoles.ts\` before merging: a layout change
          in the PDF can shift the extraction without raising an error." \
            --base main --head "$BRANCH" || echo "::notice::PR already open for $BRANCH"
